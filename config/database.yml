# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode
  username: postgres
  password: awio
  host: localhost
  #pool: 5
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: friends_management_system_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: friends_management_system_test


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary: &primary_production
    <<: *default
    database: friends_management_system_production
    username: friends_management_system
    password: <%= ENV["SIMPLE_BLOG_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: friends_management_system_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: friends_management_system_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: friends_management_system_production_cable
    migrations_paths: db/cable_migrate
    